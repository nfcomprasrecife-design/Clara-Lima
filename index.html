<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- ✅ SOLUÇÃO 1 (RESPONSIVIDADE CELULAR) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Clara ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to top, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#conteudo {
    padding: 20px;
    margin-top: 20vh;
    color: white;
}

h1 {
    font-size: 24px;
}

img {
    width: 80%;
    max-width: 350px;
    border-radius: 15px;
    margin-top: 20px;
    opacity: 0;
    transform: scale(0.8);
    transition: 1s;
}

img.mostrar {
    opacity: 1;
    transform: scale(1);
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

.sim {
    background: #ff4d6d;
    color: white;
}

.nao {
    background: #ccc;
    position: absolute;
}

/* ❤️ CORAÇÕES */
.coracao {
    position: fixed;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(45deg);
    animation: subir 5s linear infinite;
}

.coracao::before,
.coracao::after {
    content: "";
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
    position: absolute;
}

.coracao::before {
    top: -10px;
    left: 0;
}

.coracao::after {
    left: -10px;
    top: 0;
}

@keyframes subir {
    0% {
        transform: translateY(100vh) scale(0.5) rotate(45deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(1.2) rotate(45deg);
        opacity: 0;
    }
}
</style>
</head>

<body onclick="tocarMusica()">

<div id="conteudo">
    <h1>Te amo desde a outra vida ❤️</h1>
</div>

<img id="foto" src="foto.jpg">

<audio id="musica" loop>
    <source src="cant.mp3" type="audio/mpeg">
</audio>

<script>
let musicaJaTocou = false;

function tocarMusica() {
    if (!musicaJaTocou) {
        document.getElementById("musica").play();
        musicaJaTocou = true;
    }
}

/* ❤️ CORAÇÕES */
function criarCoracao() {
    const coracao = document.createElement("div");
    coracao.classList.add("coracao");

    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.animationDuration = (Math.random() * 3 + 2) + "s";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 5000);
}
setInterval(criarCoracao, 300);

/* 🎬 SEQUÊNCIA */
setTimeout(() => {
    document.getElementById("foto").classList.add("mostrar");
}, 2000);

setTimeout(() => {
    document.getElementById("conteudo").innerHTML =
    "<h1>Vamos continuar a nossa história?</h1>" +
    "<button class='sim' onclick='resposta()'>Sim ❤️</button>" +
    "<button class='nao' onmouseover='fugir(this)'>Não</button>";
}, 5000);

function fugir(btn) {
    btn.style.top = Math.random() * 80 + "%";
    btn.style.left = Math.random() * 80 + "%";
}

function resposta() {
    let c = document.getElementById("conteudo");

    c.innerHTML = "<h1>Eu sabia... ❤️</h1>";

    setTimeout(() => {
        c.innerHTML = "<h1>A gente já escolheu um ao outro faz tempo...</h1>";
    }, 2500);

    setTimeout(() => {
        c.innerHTML = "<h1>Mas faltava um detalhe...</h1>";
    }, 5000);

    setTimeout(() => {
        c.innerHTML = "<h1>Algo pra representar tudo isso 💫</h1>";
    }, 7500);

    setTimeout(() => {
        c.innerHTML = "<h1>Clara Lima... ❤️</h1>";
    }, 10000);

    setTimeout(() => {
        c.innerHTML = "<h1>Essas alianças não são um começo...</h1>";
    }, 12500);

    setTimeout(() => {
        c.innerHTML = "<h1>São a continuação da nossa história 💍</h1>";
    }, 15000);

    setTimeout(() => {
        c.innerHTML = "<h1>E um símbolo do quanto eu escolho você todos os dias ❤️</h1>";
    }, 17500);
}
</script>

</body>
</html>
